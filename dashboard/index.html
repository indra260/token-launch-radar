<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar — pre-token protocols ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"></div>
    <div>
      <h1>Token Launch Radar</h1>
      <p class="tagline">Protocols that record no token yet, ranked by what a launch would be worth if their record stayed as it is.</p>
    </div>
  </div>
  <div class="snapshot-meta" id="snapshotMeta"></div>
</header>

<section class="stats" id="stats"></section>

<section class="controls" aria-label="Board controls">
  <label class="ctl grow">Search
    <input id="q" type="search" placeholder="Protocol name or slug…" autocomplete="off">
  </label>
  <label class="ctl">Category
    <select id="cat"></select>
  </label>
  <label class="ctl">Chain
    <select id="chain"></select>
  </label>
  <label class="ctl">Flags
    <select id="flags">
      <option value="all">All rows</option>
      <option value="watchlist">Watchlist only</option>
      <option value="risk">Has a risk flag</option>
      <option value="high">Has a high-risk flag</option>
      <option value="clean">No risk flags</option>
    </select>
  </label>
  <span class="rowcount" id="rowCount"></span>
</section>

<main class="layout">
  <div class="board-wrap">
    <table class="board" id="board">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
    <p class="empty" id="empty" hidden>No protocol matches those filters. Loosen one and the radar sweeps again.</p>
  </div>
  <aside class="detail" id="detail" aria-label="Protocol detail"></aside>
</main>

<footer class="method" id="method"></footer>

<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
